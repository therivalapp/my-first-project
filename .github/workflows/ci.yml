name: CI

# Runs on every pull request, and on main so the branch's own history stays
# green. The app lives in rival/, so every step runs from there.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the earlier run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rival

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rival/package-lock.json

      # ci, not install: it installs exactly what the lockfile pins and fails
      # if the lockfile and package.json disagree.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test
